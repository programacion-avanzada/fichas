<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fichas</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Fichas',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      plugins: [
        function (hook) {
          hook.beforeEach(function (md) {
            return md
              .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
                return katex.renderToString(tex, { displayMode: true, throwOnError: false });
              })
              .replace(/(?<!\\)\$(.+?)(?<!\\)\$/g, function (_, tex) {
                return katex.renderToString(tex, { throwOnError: false });
              });
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
